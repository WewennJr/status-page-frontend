# Nginx : frontend compilé + proxy API vers le backend (port 8002)
#
# Build du frontend :
#   cd status-frontend && npm run build   (sortie dans dist/)
#
# Adapte server_name et les chemins.

server {
    listen 80;
    server_name status.example.com;

    # Frontend Vue compilé
    root /var/www/status-page;
    index index.html;

    # SPA : toutes les routes non-API tombent sur index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API -> FastAPI
    location /api/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache long pour les assets fingerprintés
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
