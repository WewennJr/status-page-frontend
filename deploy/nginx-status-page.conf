# Nginx : frontend compilé + proxy API vers le backend (port 8002)
#
# Build du frontend :
#   cd status-frontend && npm run build   (sortie dans dist/)
#
# Adapte server_name et les chemins.

server {
    listen 80;
    server_name status.example.com;

    # Frontend Vue compilé
    root /var/www/status-page;
    index index.html;

    # En-têtes de sécurité (nginx sert le statique, l'API les ajoute aussi).
    # Attention : add_header dans un location annule l'héritage -> répété ci-dessous.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # SPA : toutes les routes non-API tombent sur index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API -> FastAPI
    location /api/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache long pour les assets fingerprintés
    # (répéter les en-têtes de sécurité : add_header n'est pas hérité ici)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }
}
